<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="조선대학교 일반대학원 수료요건·졸업요건 체크리스트. Graduation requirements checklist for Chosun University General Graduate School.">
<meta name="theme-color" content="#12306b">

<meta property="og:title" content="수료요건 체크리스트 | Graduation Requirements Checklist">

<style>
:root{--navy:#12306b;--blue:#1f5fbf;--sky:#eaf2ff;--line:#d5deee;--ink:#1c2433;--mute:#667088;--ok:#17803d;--warn:#b45309;--warnbg:#fff6e5;--red:#c0262d}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#f5f8fd;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:36px 16px 70px}
header .in{max-width:860px;margin:0 auto;position:relative}
header small{opacity:.85;font-size:14px}
header h1{margin:6px 0 8px;font-size:clamp(24px,5vw,34px);line-height:1.3;padding-right:150px}
header p{margin:0;opacity:.9;font-size:14.5px}
.basis{display:inline-block;margin-top:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 12px;font-size:13.5px;font-weight:700}
.lang{position:absolute;top:0;right:0;display:flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;font-weight:700;font-size:13.5px;padding:6px 13px;border-radius:99px;cursor:pointer;font-family:inherit}
.lang button.on{background:#fff;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px;box-shadow:0 2px 8px rgba(18,48,107,.05)}
.top{margin-top:-46px}
.card h2{margin:0 0 12px;font-size:18px;color:var(--navy);display:flex;align-items:center;gap:8px}
.num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:14px;align-items:center;justify-content:center;flex:none}
.hd{cursor:pointer;user-select:none}
.hd .sum{margin-left:auto;font-size:13px;font-weight:600;color:var(--mute);text-align:right}
.hd .chev{font-size:14px;color:var(--mute);transition:transform .2s}
.step.collapsed .body{display:none}
.step.collapsed .chev{transform:rotate(-90deg)}
.step.collapsed h2{margin-bottom:0}
.step.locked{opacity:.55}
.step.locked .hd{cursor:not-allowed}
.step.passed .num{background:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.opts.col{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;cursor:pointer;font-size:15.5px;text-align:left;font-family:inherit;color:var(--ink);width:100%}
.opt:hover{border-color:var(--blue)}
.opt.on{border-color:var(--blue);background:var(--sky);color:var(--navy);font-weight:700}
.opt small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.search{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:16px;font-family:inherit}
.search:focus{outline:none;border-color:var(--blue)}
.results{margin-top:8px;display:grid;gap:6px}
.res{border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff;text-align:left;font-size:15.5px;font-family:inherit;cursor:pointer;color:var(--ink);width:100%}
.res:hover{border-color:var(--blue);background:var(--sky)}
.res small{display:block;color:var(--mute);font-size:13px}
.nf{margin-top:8px;border-style:dashed;color:var(--mute)}
.chosen{display:flex;align-items:center;gap:10px;background:var(--sky);border:1.5px solid var(--blue);border-radius:10px;padding:11px 14px;font-weight:700;color:var(--navy);flex-wrap:wrap}
.chosen small{font-weight:500;color:var(--mute)}
.chosen button{margin-left:auto;background:#fff;border:1px solid var(--blue);color:var(--blue);border-radius:8px;padding:5px 10px;cursor:pointer;font-family:inherit;font-weight:600}
.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f1f5fb;border:1px solid var(--line);font-size:14px;color:#37445f}
.note.warn{background:var(--warnbg);border-color:#f3d9a4;color:#7a4a08}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-top:10px;background:#fff}
.flag input{margin-top:5px;width:18px;height:18px;flex:none}
.flag small{display:block;color:var(--mute)}
.flag.on{background:var(--sky);border-color:var(--blue)}
.nextbtn{display:block;width:100%;margin-top:14px;border:0;background:var(--blue);color:#fff;font-weight:700;border-radius:10px;padding:13px;font-size:15.5px;cursor:pointer;font-family:inherit}
.nextbtn:disabled{background:#b9c4da;cursor:not-allowed}
.sub3{margin:16px 0 6px;font-size:15px;color:var(--navy);font-weight:800}
.prog{height:12px;background:#e6ecf7;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--ok));transition:width .3s}
.progtxt{font-size:14px;color:var(--mute);display:flex;justify-content:space-between}
.sec{margin:20px 0 8px;font-size:16px;color:var(--navy);font-weight:800;border-left:4px solid var(--blue);padding-left:8px}
.item{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.item.clickable{cursor:pointer}
.item input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--ok)}
.item .mark{width:22px;height:22px;flex:none;margin-top:2px;border-radius:5px;border:2px solid #b9c4da;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:800}
.item.done .mark{background:var(--ok);border-color:var(--ok)}
.item .t{font-weight:700}
.item .d{font-size:13.5px;color:var(--mute);margin-top:2px}
.item.done{background:#f1faf4;border-color:#bfe3ca}
.item.done .t{color:var(--ok)}
.inp{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;flex-wrap:wrap}
.inp input{width:96px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:15px;font-family:inherit}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;background:var(--sky);color:var(--blue);vertical-align:middle}
.tag.cond{background:var(--warnbg);color:var(--warn)}
.ln{display:flex;gap:8px;font-size:14.5px;padding:2px 0;color:var(--mute)}
.ln.y{color:var(--ok);font-weight:700}
.ln.bad{color:var(--red);font-weight:700}
.box{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;background:#fbfdff}
.box h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.res2{margin-top:8px;padding:10px 12px;border-radius:10px;font-weight:700;font-size:15px}
.res2.y{background:#e8f6ec;color:var(--ok)}
.res2.n{background:#f1f3f8;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;margin-top:8px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:3px;flex:none}
.lim{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.lim div{background:var(--sky);border-radius:10px;padding:10px 12px;font-size:14px}
.lim b{display:block;font-size:20px;color:var(--navy)}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
summary{cursor:pointer;padding:12px 14px;font-weight:700;color:var(--navy)}
details .in{padding:0 14px 12px;font-size:14.5px}
details ul{margin:4px 0;padding-left:20px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}
button.act,a.act{display:inline-block;border:0;background:var(--blue);color:#fff;font-weight:700;border-radius:10px;padding:10px 16px;font-size:14.5px;cursor:pointer;font-family:inherit;text-decoration:none;margin:8px 8px 0 0}
button.act.ghost,a.act.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.privacy{font-size:13px;color:var(--mute);margin-top:10px}
footer{text-align:center;font-size:13px;color:var(--mute);margin-top:26px}
.tel{font-size:22px;font-weight:800;color:var(--navy)}
@media(max-width:520px){header h1{padding-right:0;margin-top:34px}}
@media print{
 body{background:#fff}header{background:#fff;color:#000;padding:10px 0}.basis{border-color:#000;color:#000;background:none}
 .no-print,.lang,#stepDept,#stepCourse,#stepTerm{display:none!important}
 #stepList .body{display:block!important}
 .card{box-shadow:none;border:0;padding:6px 0;margin-top:8px}.top{margin-top:0}
 .item,.box,details{break-inside:avoid}
 header h1{padding-right:0;margin-top:0}
}
</style>
</head>

<header>
 <div class="in">
  <div class="lang no-print" id="langBox" role="group" aria-label="Language">
   <button id="lgKo" onclick="setLang('ko')">한국어</button>
   <button id="lgEn" onclick="setLang('en')">English</button>
  </div>
  <small id="hSmall"></small>
  <h1 id="hTitle"></h1>
  <p id="hDesc"></p>
  <span class="basis" id="basis"></span>
 </div>
</header>

<div class="wrap">

 <section class="card top">
  <h2 id="ttlTop"></h2>
  <div class="note warn" style="margin-top:0" id="topNote"></div>
 </section>

 <section class="card step" id="stepDept">
  <h2 class="hd" onclick="goStep(1)"><span class="num">1</span><span id="ttl1"></span><span class="sum" id="sum1"></span><span class="chev">▾</span></h2>
  <div class="body" id="deptBody"></div>
 </section>

 <section class="card step" id="stepCourse">
  <h2 class="hd" onclick="goStep(2)"><span class="num">2</span><span id="ttl2"></span><span class="sum" id="sum2"></span><span class="chev">▾</span></h2>
  <div class="body" id="courseBody"></div>
 </section>

 <section class="card step" id="stepTerm">
  <h2 class="hd" onclick="goStep(3)"><span class="num">3</span><span id="ttl3"></span><span class="sum" id="sum3"></span><span class="chev">▾</span></h2>
  <div class="body" id="termBody"></div>
 </section>

 <section class="card step" id="stepList">
  <h2 class="hd" onclick="goStep(4)"><span class="num">4</span><span id="ttl4"></span><span class="sum" id="sum4"></span><span class="chev">▾</span></h2>
  <div class="body">
   <div id="summary" style="font-size:14.5px;color:var(--mute);margin-bottom:8px"></div>
   <div class="sec" style="margin-top:6px" id="secA"></div>
   <div class="progtxt"><span id="progLabel"></span><b id="progPct">0%</b></div>
   <div class="prog"><i id="progBar"></i></div>
   <div id="listBox" style="margin-top:12px"></div>
   <div class="sec" id="secB"></div>
   <div id="gradBox"></div>
   <div class="sec" id="secC"></div>
   <div class="lim" id="limBox"></div>
   <p class="privacy" id="privacy"></p>
   <div class="no-print">
    <button class="act" id="btnPrint" onclick="window.print()"></button>
    <button class="act ghost" id="btnSel" onclick="resetSel()"></button>
    <button class="act ghost" id="btnAll" onclick="resetAll()"></button>
   </div>
  </div>
 </section>

 <section class="card" id="guideCard">
  <h2 id="ttlGuide"></h2>
  <div id="guideBox"></div>
 </section>

 <section class="card" id="contactCard">
  <h2 id="ttlContact"></h2>
  <table id="contactTbl"></table>
 </section>

 <footer id="footer"></footer>
</div>

let LANG = "ko";
try{ const sv=localStorage.getItem(C.langKey); if(sv==="ko"||sv==="en") LANG=sv; }catch(e){}
const t = (k,...a)=>{ let v=I18N[LANG][k]; if(v===undefined) v=I18N.ko[k]; return typeof v==="function"?v(...a):v; };

/* ====================== 데이터 ====================== */
const CK_MAP = {m:"master", d:"doctor", i:"integ"};
const D = C.depts.map(([n,c,e,en])=>({n, en:en||n, ex:!!e, courses:c.split("").map(x=>CK_MAP[x])}));
const dn = d => LANG==="en" ? d.en : d.n;
const dsub = d => LANG==="en" ? d.n : "";               // 영문 모드에서 한글 공식명도 함께 표시

let P = {checked:{}, vals:{}};                                           // 저장되는 값
let S = {dept:null, notFound:false, course:null, ex:false, term:null, step:1, max:1, q:""}; // 매번 새로 시작하는 선택

function loadP(){ try{ const j=JSON.parse(localStorage.getItem(C.storageKey)); if(j) P=Object.assign(P,j);}catch(e){} }
function saveP(){ try{ localStorage.setItem(C.storageKey, JSON.stringify(P)); }catch(e){} }
const normS = s => String(s).replace(/[\s.·ㆍ＊*#()（）\-_,'’"/]/g,"").toLowerCase();
const cName = c => t("c_"+c), cShort = c => t("cs_"+c);
const courseText = d => d.courses.map(cShort).join(" · ");
const termLabel = (course,id) => id==="base"?t("term_base"):id==="short2"?t("term_short2"):(course==="master"?t("term_short_master"):t("term_short_integ"));
const telHref = x => "tel:"+x.replace(/-/g,"");

function setLang(l){
  LANG=l; try{ localStorage.setItem(C.langKey,l); }catch(e){}
  renderAll(); renderStatic();
}

function init(){ loadP(); renderStatic(); renderAll(); }

/* ====================== 고정 문구 ====================== */
function renderStatic(){
  document.documentElement.lang=t("htmlLang"); document.title=t("docTitle");
  $("lgKo").classList.toggle("on",LANG==="ko"); $("lgEn").classList.toggle("on",LANG==="en");
  $("hSmall").textContent=t("hSmall"); $("hTitle").textContent=t("hTitle"); $("hDesc").innerHTML=t("hDesc");
  $("basis").textContent=t("basis",C.basisDate);
  $("ttlTop").textContent=t("ttlTop");
  $("topNote").innerHTML="<ul style='margin:0;padding-left:18px'>"+t("topNotes").map(x=>`<li>${x}</li>`).join("")+"</ul>";
  [1,2,3,4].forEach(n=>$("ttl"+n).textContent=t("ttl"+n));
  $("secA").textContent=t("secA"); $("secB").textContent=t("secB"); $("secC").textContent=t("secC");
  $("privacy").textContent=t("privacy");
  $("btnPrint").textContent=t("btnPrint"); $("btnSel").textContent=t("btnSel"); $("btnAll").textContent=t("btnAll");
  $("ttlGuide").textContent=t("ttlGuide"); $("ttlContact").textContent=t("ttlContact");
  $("footer").innerHTML=t("footer");
  $("contactTbl").innerHTML=`<tr><th>${t("th_div")}</th><th>${t("th_tel")}</th></tr>
    <tr><td>${t("ct_admin")}</td><td><a href="${telHref(C.tel)}">${C.tel}</a></td></tr>
    <tr><td>${t("ct_lib")}</td><td><a href="${telHref(C.libTel)}">${C.libTel}</a></td></tr>
    <tr><td>${t("ct_home")}</td><td><a href="${C.homepage}" target="_blank" rel="noopener">grad.chosun.ac.kr</a></td></tr>`;
  $("guideBox").innerHTML=t("guide").map(([h,b],i)=>`<details ${i===0?'open':''}><summary>${h}</summary><div class="in">${b}</div></details>`).join("");
}
function renderAll(){ renderDeptStep(); renderCourseStep(); renderTermStep(); renderSteps(); renderList(); }

/* ---------- 단계 ---------- */
function go(n){ S.max=Math.max(S.max,n); S.step=n; renderAll(); setTimeout(()=>{ const el=$(["","stepDept","stepCourse","stepTerm","stepList"][n]); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"}); },80); }
function goStep(n){ if(n>S.max) return; S.step=n; renderAll(); }
function termOpts(){ return S.course? C.terms[S.course] : []; }
function termObj(){ return termOpts().find(x=>x.id===S.term) || termOpts()[0]; }
function renderSteps(){
  [[1,"stepDept"],[2,"stepCourse"],[3,"stepTerm"],[4,"stepList"]].forEach(([n,id])=>{
    const el=$(id);
    el.classList.toggle("collapsed", n!==S.step);
    el.classList.toggle("locked", n>S.max);
    el.classList.toggle("passed", n<S.max && n!==S.step);
  });
  $("sum1").textContent = S.dept!=null ? "✔ "+dn(D[S.dept]) : "";
  $("sum2").textContent = S.max>=3 && S.course ? "✔ "+cName(S.course)+(S.ex?t("sumEx"):"") : "";
  $("sum3").textContent = S.max>=4 && S.course ? "✔ "+t("sumSem",termObj().n)+(CK("suppOn")?t("sumSupp"):"") : "";
  $("sum4").textContent = S.max<4 ? "🔒" : "";
}

/* ---------- 1단계: 학과 검색 ---------- */
function renderDeptStep(){
  const b=$("deptBody");
  if(S.dept!=null){
    const d=D[S.dept];
    b.innerHTML=`<div class="chosen">✔ ${dn(d)}<small>${dsub(d)?dsub(d)+" · ":""}${t("runs",courseText(d))}</small><button onclick="clearDept()">${t("change")}</button></div>`; return;
  }
  if(S.notFound){
    b.innerHTML=`<div class="note warn" style="margin-top:0">${t("notFoundMsg",t0(C.deptYear))}
      <div style="margin-top:8px"><a class="tel" href="${telHref(C.tel)}">☎ ${LANG==="en"?"+82-62-608-5038":C.tel}</a></div></div>
      <button class="opt nf" onclick="clearDept()">${t("searchAgain")}</button>`; return;
  }
  b.innerHTML=`<input class="search" id="deptSearch" type="search" placeholder="${t("searchPh")}" value="${S.q.replace(/"/g,'&quot;')}" oninput="onSearch(this.value)" autocomplete="off">
    <div class="results" id="results"></div>
    <button class="opt nf" onclick="pickNotFound()">${t("notFoundBtn")}</button>`;
  onSearch(S.q);
}
const t0 = o => typeof o==="object" ? (o[LANG]||o.ko) : o;
function onSearch(v){
  S.q=v; const r=$("results"); if(!r) return;
  const q=normS(v);
  if(!q){ r.innerHTML=`<div class="note" style="margin:0">${t("searchHint")}</div>`; return; }
  const toks=String(v).toLowerCase().split(/\s+/).map(normS).filter(Boolean);
  const match=(name)=>{ const nn=normS(name); return nn.includes(q) || (toks.length>1 && toks.every(k=>nn.includes(k))); };
  const hit=D.map((d,i)=>({d,i})).filter(x=>match(x.d.n)||match(x.d.en));
  r.innerHTML = hit.length ? hit.slice(0,15).map(x=>`<button class="res" onclick="pickDept(${x.i})">${dn(x.d)}<small>${dsub(x.d)?dsub(x.d)+" · ":""}${t("runs",courseText(x.d))}</small></button>`).join("")
    : `<div class="note warn" style="margin:0">${t("noResult")}</div>`;
}
function needExBox(d){ return S.course==="master" && d.ex; }
function pickDept(i){
  const d=D[i]; S.dept=i; S.notFound=false; S.ex=false; S.term=null;
  S.course = d.courses.length===1 ? d.courses[0] : null;
  S.max=2;
  if(S.course && !needExBox(d)) afterCourse(); else go(2);
}
function pickNotFound(){ S.notFound=true; renderAll(); }
function clearDept(){ S.dept=null; S.notFound=false; S.course=null; S.ex=false; S.term=null; S.step=1; S.max=1; S.q=""; renderAll(); }

/* ---------- 2단계: 학위과정 ---------- */
function renderCourseStep(){
  const b=$("courseBody");
  if(S.dept==null){ b.innerHTML=""; return; }
  const d=D[S.dept];
  let h=`<div class="opts">`+d.courses.map(c=>`<button class="opt ${S.course===c?'on':''}" onclick="pickCourse('${c}')">${cName(c)}<small>${t("creditSmall",c,C.courses[c].credits)}</small></button>`).join("")+`</div>`;
  if(d.courses.length===1) h+=`<div class="note">${t("onlyOne",dn(d),cName(d.courses[0]))}</div>`;
  if(needExBox(d)){
    h+=`<label class="flag ${S.ex?'on':''}"><input type="checkbox" ${S.ex?'checked':''} onchange="toggleEx(this.checked)"><span><b>${t("exLabel")}</b><small>${t("exSub")}</small></span></label>
         <button class="nextbtn" onclick="afterCourse()">${t("next")}</button>`;
  }
  b.innerHTML=h;
}
function pickCourse(c){
  S.course=c; S.ex=false; S.term=null;
  if(needExBox(D[S.dept])){ renderAll(); } else afterCourse();
}
function toggleEx(v){ S.ex=v; renderAll(); }
function afterCourse(){
  if(!S.course) return;
  S.term = termOpts().length>1 ? null : "base"; go(3);
}

/* ---------- 3단계: 정규 등록 학기 · 보충과목 ---------- */
function suppText(){ return S.course==="master"?t("supp_master"):t("supp_other"); }
function renderTermStep(){
  const b=$("termBody");
  if(!S.course){ b.innerHTML=""; return; }
  let h="";
  if(termOpts().length>1){
    h+=`<div class="sub3" style="margin-top:0">${t("termTitle")}</div><div class="opts col">`+termOpts().map(o=>{
      const sub = (S.course==="master"&&S.ex&&o.id==="short") ? t("termReqEx",o.n,C.exempt.total) : t("termReq",o.n);
      return `<button class="opt ${S.term===o.id?'on':''}" onclick="pickTerm('${o.id}')">${termLabel(S.course,o.id)}<small>${sub}</small></button>`;
    }).join("")+`</div>`;
  }else{
    h+=`<div class="note" style="margin-top:0">${t("termFixed",cName(S.course),termOpts()[0].n)}</div>`;
  }
  h+=`<div class="sub3">${t("suppTitle")}</div>
    <label class="flag ${CK('suppOn')?'on':''}" style="margin-top:0"><input type="checkbox" ${CK('suppOn')?'checked':''} onchange="toggleSupp(this.checked)"><span><b>${t("suppLabel")}</b><small>${t("suppDesc",suppText())}</small></span></label>
    <button class="nextbtn" ${S.term?'':'disabled'} onclick="go(4)">${t("nextCheck")}</button>`;
  b.innerHTML=h;
}
function pickTerm(id){ S.term=id; renderAll(); }
function toggleSupp(v){ P.checked[K('suppOn')]=v; saveP(); renderAll(); }

/* ---------- 4단계 ---------- */
const K = id => S.course+"|"+id;
const V = id => { const v=parseFloat(P.vals[K(id)]); return isNaN(v)?null:v; };
const CK = id => !!P.checked[K(id)];
function isEx(){ return S.course==="master" && S.ex; }
function gpaOK(){ const g=V("gpa"); return g!==null && g>=C.gpaMin && g<=C.gpaMax; }
function exemptState(){
  const cur=V("credit"), base=V("base");
  const totalOK = cur!==null && cur>=C.exempt.total;
  const baseBad = cur!==null && base!==null && base>cur;
  const after = (cur!==null && base!==null && !baseBad) ? cur-base : null;
  const afterOK = after!==null && after>=C.exempt.after;
  return {cur,base,after,totalOK,afterOK,baseBad,done:totalOK&&afterOK};
}
const ln = (ok,x,bad) => `<div class="ln ${ok?'y':(bad?'bad':'')}"><span>${ok?'✔':(bad?'⚠':'○')}</span><span>${x}</span></div>`;

function buildItems(){
  const c=C.courses[S.course], it=[];
  const lab = (S.term!=="base"&&termOpts().length>1) ? termLabel(S.course,S.term) : "";
  it.push({id:"terms",type:"num",req:termObj().n,unit:t("u_sem"),title:t("i_terms",termObj().n,lab),desc:t("i_terms_d"),label:t("i_terms_l")});
  if(isEx()) it.push({id:"credit",type:"exempt",title:t("i_credExT",C.exempt.total)});
  else it.push({id:"credit",type:"num",req:c.credits,unit:t("u_cr"),title:t("i_cred",c.credits,S.course==="master"),desc:t("i_cred_d"),label:t("i_cred_l")});
  it.push({id:"gpa",type:"gpa",title:t("i_gpa",C.gpaMin.toFixed(1),C.gpaMax),desc:t("i_gpa_d"),label:t("i_gpa_l")});
  it.push({id:"ethics",type:"check",title:t("i_eth"),desc:t("i_eth_d")});
  if(!isEx()) it.push({id:"thesis",type:"check",title:S.course==="master"?t("i_thesis_master"):t("i_thesis_dr"),desc:t("i_thesis_d")});
  it.push({id:"foreign",type:"check",title:t("i_for"),desc:t("i_for_d",isSix())});
  if(CK("suppOn")) it.push({id:"supp",type:"num",req:c.suppN,unit:t("u_cr"),cond:true,title:t("i_supp",c.suppN),desc:t("i_supp_d",suppText()),label:t("i_supp_l")});
  return it;
}
function itemDone(x){
  if(x.type==="check") return CK(x.id);
  if(x.type==="exempt") return exemptState().done;
  if(x.type==="gpa") return gpaOK();
  const v=V(x.id); return v!==null && v>=x.req;
}
function inputHtml(id,label,unit,step,max,val){
  return `<div class="inp"><span>${label}</span><input type="number" inputmode="decimal" min="0" max="${max}" step="${step}" value="${val===null?'':val}" onchange="setVal('${id}',this.value)"> <span>${unit}</span></div>`;
}
function renderList(){
  if(S.max<4||!S.course){ $("listBox").innerHTML=""; $("gradBox").innerHTML=""; $("summary").innerHTML=""; $("limBox").innerHTML=""; return; }
  const c=C.courses[S.course], items=buildItems();
  $("summary").innerHTML=`${S.dept!=null?dn(D[S.dept])+" · ":""}<b>${cName(S.course)}</b>${isEx()?t("exTag"):(S.course==="master"?t("thTag"):"")}`;
  const done=items.filter(itemDone).length, pct=Math.round(done/items.length*100);
  $("progBar").style.width=pct+"%"; $("progPct").textContent=pct+"%";
  $("progLabel").textContent = done===items.length ? t("progAll") : t("progN",done,items.length);
  $("listBox").innerHTML = items.map(x=>{
    const d=itemDone(x), tag=x.cond?`<span class="tag cond">${t("cond")}</span>`:`<span class="tag">${t("req")}</span>`;
    if(x.type==="check") return `<label class="item clickable ${d?'done':''}"><input type="checkbox" ${d?'checked':''} onchange="setCheck('${x.id}',this.checked)"><div><div class="t">${x.title}${tag}</div><div class="d">${x.desc}</div></div></label>`;
    if(x.type==="exempt"){
      const s=exemptState();
      let msg=""; if(s.baseBad) msg=ln(false,t("ex_bad"),true);
      else if(s.cur!==null&&s.base!==null&&!s.done){
        if(s.totalOK&&!s.afterOK) msg=ln(false,t("ex_lackAfter",C.exempt.after-s.after),true);
        else if(!s.totalOK&&s.afterOK) msg=ln(false,t("ex_lackTotal",C.exempt.total-s.cur),true);
      }
      return `<div class="item ${d?'done':''}"><div class="mark">${d?'✓':''}</div><div style="flex:1"><div class="t">${x.title}${tag}</div>
        <div class="d">${t("ex_d",C.exempt.total,C.exempt.after)}</div>
        ${inputHtml("credit",t("ex_l1"),t("u_cr"),"1","200",s.cur)}${inputHtml("base",t("ex_l2"),t("u_cr"),"1","200",s.base)}
        <div style="margin-top:8px">${s.cur===null?"":ln(s.totalOK,t("ex_total",s.cur,C.exempt.total))}
        ${s.after===null?"":ln(s.afterOK,t("ex_after",s.after,C.exempt.after))}${msg}</div></div></div>`;
    }
    const v=V(x.id), isG=x.type==="gpa";
    const bad = isG && v!==null && (v>C.gpaMax||v<0);
    return `<div class="item ${d?'done':''}"><div class="mark">${d?'✓':''}</div><div style="flex:1"><div class="t">${x.title}${tag}</div><div class="d">${x.desc}</div>
      ${inputHtml(x.id,x.label,isG?"":x.unit,isG?"0.01":"1",isG?C.gpaMax:"200",v)}
      <div style="margin-top:4px">${bad?ln(false,t("gpaOver",C.gpaMax),true):(v!==null?`<b>${isG?v:v+" / "+x.req+" "+x.unit}</b>`:`<span class="d">(${t("stdPrefix")}${isG?C.gpaMin.toFixed(1):x.req+" "+x.unit})</span>`)}</div></div></div>`;
  }).join("") + (isEx()?`<div class="note">${t("noThesisNote")}</div>`:"");
  renderGrad();
  $("limBox").innerHTML=`<div>${t("limA")}<b>${t("lim_cr",9)}</b></div><div>${t("limB")}<b>${t("lim_cr",c.limitSame)}</b></div><div>${t("limC")}<b>${t("lim_within",c.limitOtherN)}</b></div>`;
}
function setCheck(id,v){ P.checked[K(id)]=v; saveP(); renderList(); }
function setVal(id,v){ P.vals[K(id)]=v; saveP(); renderList(); }

/* ---------- 졸업요건 ---------- */
function chkHtml(id,text){ return `<label class="chk"><input type="checkbox" ${CK(id)?'checked':''} onchange="setCheck('${id}',this.checked)"><span>${text}</span></label>`; }
function renderGrad(){
  const c=C.courses[S.course], cur=V("credit"), credOK=cur!==null&&cur>=c.credits, g=gpaOK(), fo=CK("foreign");
  const gm=C.gpaMin.toFixed(1);
  const examOK=credOK&&g&&fo, passed=CK("examPass");
  let h=`<div class="box"><h3>${t("g1")}</h3>
    ${ln(credOK,t("g_cred",c.credits,cur))}${ln(g,t("g_gpa",gm))}${ln(fo,t("g_for"))}
    <div class="res2 ${examOK?'y':'n'}">${examOK?t("g_examOk",c.examSubjects):t("g_examNo")}</div>
    ${chkHtml("examPass",t("g_pass"))}
    <div class="privacy">${t("g_examNote")}</div></div>`;
  if(isEx()){
    h+=`<div class="box"><h3>${t("g2")}</h3><div class="note" style="margin-top:0">${t("g2ex")}</div></div>`;
  }else{
    const master=S.course==="master";
    const thesisOK = CK("thesis")||(master&&CK("thesisIng")), ethOK = CK("ethics")||CK("ethicsIng");
    const rows=[
      ln(credOK, master?t("g_cm",c.credits):t("g_cd",c.credits)),
      ln(fo,t("g_for")), ln(passed,t("g_ft")),
      ln(thesisOK, master?t("g_th1"):t("g_th2")),
      ln(ethOK,t("g_ethOk")), ln(g,t("g_gpa",gm))
    ];
    let extra="";
    if(master&&!CK("thesis")) extra+=chkHtml("thesisIng",t("g_thIng"));
    if(!CK("ethics")) extra+=chkHtml("ethicsIng",t("g_ethIng"));
    let research=true;
    if(!master){ research=CK("research"); rows.push(ln(research,t("g_res"))); extra+=chkHtml("research",t("g_resChk")); }
    const all=credOK&&fo&&passed&&thesisOK&&ethOK&&g&&research;
    h+=`<div class="box"><h3>${t("g2t")}</h3>${rows.join("")}<div class="res2 ${all?'y':'n'}">${all?t("g_subOk"):t("g_examNo")}</div>${extra}
      ${master?"":`<div class="privacy">${t("g_resNote")}</div>`}</div>`;
  }
  $("gradBox").innerHTML=h;
}

function resetSel(){ S={dept:null,notFound:false,course:null,ex:false,term:null,step:1,max:1,q:""}; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); }
function resetAll(){ if(!confirm(t("confirmAll"))) return; P={checked:{},vals:{}}; saveP(); resetSel(); }

init();
</script>
</body>
